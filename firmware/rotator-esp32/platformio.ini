; OrbitGuard Dual-Axis Antenna Rotator Controller
; PlatformIO Configuration for ESP32-WROOM-32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    waspinator/AccelStepper @ ^1.64

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ROTATOR_MAX_AZ=450
    -D ROTATOR_MAX_EL=180
