name: CI Quality Gate & Automated Tests

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint & Astrodynamic Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Ruff Linting
        run: ruff check backend/ scripts/ tests/
      - name: Run Pytest SGP4 Verification & Unit Tests
        run: pytest tests/ -v

  frontend-test:
    name: Frontend Typecheck, Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  desktop-test:
    name: Desktop Typecheck, Security Tests & Electron Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci
      - name: Typecheck Frontend & Desktop
        run: npm run typecheck
      - name: Run Full Unit & Safety Test Suite
        run: npm test
      - name: Build Electron Main & Preload
        run: npm run build:electron
