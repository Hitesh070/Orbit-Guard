name: Refresh Orbital Catalog Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Orbital Data Pipeline
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
        run: |
          python scripts/pipeline/fetch_catalog.py
          python scripts/pipeline/screen_conjunctions.py
      - name: Commit and push updated artifacts
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "OrbitGuard Data Pipeline [bot]"
          git add frontend/public/data/ backend/data/
          # NOTE: no "[skip ci]" here - Vercel honours it and would never redeploy the fresh data.
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): automated orbital catalog refresh"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
